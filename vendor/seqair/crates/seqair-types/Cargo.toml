[package]
name = "seqair-types"
version = "0.4.0"
edition = "2024"
description = "Core types for the seqair bioinformatics library"
repository = "https://github.com/Softleif/seqair"
license = "MIT OR Apache-2.0"
rust-version = "1.98.1"
readme = "README.md"

[dependencies]
serde = { workspace = true, optional = true }
thiserror = { workspace = true }
bytemuck = { workspace = true }
winnow = "1.0.4"
smallvec = { version = "2.0.0-beta.3", features = ["std"] }
smol_str = "0.3.7"
fearless_simd = { workspace = true }
fearless_simd_macros = { workspace = true }

rust-htslib = { workspace = true, optional = true, default-features = false }

[features]
# On by default: the impls existed unconditionally through 0.2, so turning
# them off here would break every caller that serializes a `Base`. A caller
# that wants neither serde nor its compile time opts out with
# `default-features = false`.
default = ["serde"]
# Adds conversion traits to convert between seqair-types and rust-htslib types
hts-compat = ["dep:rust-htslib"]
# `Serialize`/`Deserialize` for the value types, including the re-exported
# `SmolStr` and `SmallVec`.
serde = ["dep:serde", "smallvec/serde", "smol_str/serde"]


[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(coverage_nightly)', 'cfg(fuzzing)'] }
