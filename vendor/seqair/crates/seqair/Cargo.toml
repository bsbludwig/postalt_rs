[package]
name = "seqair"
version = "0.8.0"
edition = "2024"
description = "Pure-Rust BAM/SAM/CRAM/FASTA reader and pileup engine"
repository = "https://github.com/Softleif/seqair"
license = "MIT OR Apache-2.0"
rust-version = "1.98.1"
readme = "../../README.md"
exclude = ["tests/*", "benches/*"]

[package.metadata.docs.rs]
cargo-args = ["-Zunstable-options", "-Zrustdoc-scrape-examples"]

[package.metadata.cargo-shear]
# Only ever included through `#[path]` from a bench, an example and a unit test,
# which cargo-shear does not follow.
ignored-paths = ["tests/support/cram_raw_blocks.rs"]

[features]
# Forwards `seqair-types/serde`; seqair itself serializes nothing.
serde = ["seqair-types/serde"]
fuzz = ["dep:bzip2"]

[dependencies]
thiserror = { workspace = true }
tracing = { workspace = true }
bytemuck = { workspace = true }
indexmap = "2"
itoa = "1"
libdeflater = "1.26.1"
seqair-types = { version = "^0.4.0", path = "../seqair-types", default-features = false }
rustc-hash = "2.1.3"
# `HashTable`: a hash table whose equality lives outside the stored value —
# mate linking stores record indices and compares the qnames they point into.
hashbrown = "0.17.1"
flate2 = "1.1.10"
bz2ngrs = "0.1.0"
bzip2 = { version = "0.6.1", optional = true }
xz2 = "0.1.7"
md5 = "0.8.1"
fearless_simd = { workspace = true }
fearless_simd_macros = { workspace = true }


[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(coverage_nightly)', 'cfg(fuzzing)'] }
