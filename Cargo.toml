[package]
name = "postalt_rs"
version = "0.1.0"
edition = "2024"
rust-version = "1.98.1"
license = "GPL-3.0-only"
description = "Streaming, bwa-postalt.js r985 compatible ALT alignment postprocessing"

[dependencies]
seqair = { path = "vendor/seqair/crates/seqair" }
anyhow = "1"
flate2 = "1"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
